[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-orchestrator"
version = "3.0.0"
description = "Master Agent Orchestrator, Quota Supervisor, and Multi-Worker Evidence Coordinator for MCP-Compatible Coding Agents."
readme = "README.md"
authors = [
    { name = "aethelondev-stack" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.4.0",
    "mcp>=1.0.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[project.scripts]
orchestrator = "orchestrator.cli:main"
orchestrator-mcp = "orchestrator.mcp_server:main"
